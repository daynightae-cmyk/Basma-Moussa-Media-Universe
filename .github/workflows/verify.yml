name: Basma source verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE44_APP_ID: "6af1122f059da84360b9db9c"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Verify asset policy
        run: npm test
      - name: Lint source
        run: npm run lint
      - name: Build application
        run: npm run build
