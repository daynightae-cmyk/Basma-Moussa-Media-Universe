<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.7" y2="1">
      <stop stop-color="#050913"/>
      <stop offset="0.5" stop-color="#0B1224"/>
      <stop offset="1" stop-color="#04070E"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="50%">
      <stop stop-color="#F2D7A0" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#C89B56" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#C89B56" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oculus" cx="50%" cy="50%" r="50%">
      <stop stop-color="#FFF4D8" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#F2D7A0" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#D7AB62" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#6B4E25"/>
      <stop offset="0.4" stop-color="#F2D7A0"/>
      <stop offset="0.72" stop-color="#C89B56"/>
      <stop offset="1" stop-color="#7E5D2A"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0A0F1C"/>
      <stop offset="0.45" stop-color="#241B26" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0B1120"/>
      <stop offset="1" stop-color="#04060C"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="1200" fill="url(#base)"/>
  <ellipse cx="450" cy="470" rx="430" ry="520" fill="url(#halo)"/>

  <!-- the portal: a double arch of brushed gold -->
  <path d="M138 1120V436c0-360 624-360 624 0v684" fill="#070C16"/>
  <path d="M138 1120V436c0-360 624-360 624 0v684" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.8"/>
  <path d="M176 1120V448c0-306 548-306 548 0v672" fill="none" stroke="#F2D7A0" stroke-width="1" opacity="0.36"/>
  <path d="M214 1120V460c0-260 472-260 472 0v660" fill="none" stroke="#C89B56" stroke-width="0.8" opacity="0.22"/>

  <!-- light inside the portal -->
  <path d="M214 1120V460c0-260 472-260 472 0v660Z" fill="url(#curtain)" opacity="0.7"/>
  <path d="M300 1120L420 300h60l120 820Z" fill="#F2D7A0" opacity="0.045" filter="url(#soft)"/>
  <path d="M450 300v820" stroke="#F2D7A0" stroke-opacity="0.12"/>

  <!-- the oculus / distant sun -->
  <circle cx="450" cy="452" r="118" fill="url(#oculus)"/>
  <circle cx="450" cy="452" r="62" fill="none" stroke="#F2D7A0" stroke-opacity="0.36"/>
  <circle cx="450" cy="452" r="4" fill="#FFF6E0" filter="url(#glow)"/>

  <!-- the golden thread: from the floor, through the portal, into the light -->
  <g fill="none" stroke="url(#gold)">
    <path d="M60 1180C210 940 300 1010 330 850S250 616 314 496s210-60 294-100" stroke-width="6" opacity="0.72"/>
    <path d="M96 1192C242 960 332 1024 362 864S286 626 350 512s196-54 276-94" stroke-width="1.3" opacity="0.62"/>
    <path d="M28 1160C176 912 262 982 292 830S214 606 278 474" stroke-width="1" opacity="0.3"/>
  </g>
  <circle cx="612" cy="398" r="4" fill="#FFF4D8" filter="url(#glow)"/>

  <!-- the single director's chair: symbolic, not a person -->
  <g opacity="0.92">
    <ellipse cx="452" cy="1080" rx="150" ry="18" fill="#02040A" opacity="0.7"/>
    <rect x="382" y="842" width="140" height="120" rx="8" fill="#0A0F1B" stroke="#C89B56" stroke-opacity="0.55" stroke-width="1.4"/>
    <rect x="398" y="860" width="108" height="78" rx="3" fill="#111827"/>
    <path d="M398 900h108" stroke="#C89B56" stroke-opacity="0.28"/>
    <rect x="356" y="962" width="192" height="20" rx="5" fill="#0C1220" stroke="#C89B56" stroke-opacity="0.62" stroke-width="1.4"/>
    <path d="M378 982l-26 96M526 982l26 96M404 982l-8 96M496 982l8 96" stroke="#C89B56" stroke-opacity="0.62" stroke-width="3"/>
    <path d="M366 1032h170M400 1052h100" stroke="#C89B56" stroke-opacity="0.24" stroke-width="2"/>
  </g>

  <!-- floor perspective -->
  <path d="M0 1060h900" stroke="#D7AB62" stroke-opacity="0.16"/>
  <g stroke="#D7AB62" stroke-opacity="0.09">
    <path d="M0 1200L450 1060l450 140"/>
    <path d="M150 1200L450 1060l300 140"/>
    <path d="M300 1200L450 1060l150 140"/>
  </g>

  <!-- dust -->
  <g fill="#F2D7A0">
    <circle cx="232" cy="560" r="2" opacity="0.6"/><circle cx="690" cy="360" r="1.6" opacity="0.5"/>
    <circle cx="620" cy="760" r="2.2" opacity="0.4"/><circle cx="292" cy="300" r="1.4" opacity="0.45"/>
    <circle cx="742" cy="884" r="1.5" opacity="0.35"/><circle cx="168" cy="795" r="1.2" opacity="0.3"/>
  </g>
</svg>
